<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d186"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#1e293b" stroke-width="8"/>
  
  <!-- Círculo de néon -->
  <circle cx="256" cy="256" r="160" fill="#10b981" fill-opacity="0.08" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#emeraldGrad)" stroke-width="12" stroke-dasharray="16 8"/>
  
  <!-- Ícone Carro Estilizado -->
  <g transform="translate(128, 140) scale(1.1)">
    <!-- Chassis -->
    <path d="M30 140 L50 90 Q65 60 115 60 L135 60 Q185 60 200 90 L220 140 Q235 150 235 170 L235 185 Q235 195 220 195 L200 195 Q195 195 190 180 Q185 160 160 160 Q135 160 130 180 Q125 195 110 195 L50 195 Q35 195 30 180 Q25 160 10 160 Q-15 160 -20 180 L-25 195 Q-40 195 -40 185 L-40 170 Q-40 150 -25 140 Z" fill="url(#emeraldGrad)" transform="translate(20, -10)"/>
    
    <!-- Faróis -->
    <circle cx="50" cy="140" r="14" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="200" cy="140" r="14" fill="#ffffff" filter="url(#glow)"/>
    
    <!-- Símbolo do Euro no Tejadilho -->
    <text x="125" y="45" font-family="sans-serif" font-size="52" font-weight="900" fill="#34d186" text-anchor="middle">€</text>
  </g>
</svg>
